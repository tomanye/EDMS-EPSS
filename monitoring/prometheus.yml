# ==============================================================================
# Prometheus Configuration for EPSS Enterprise EDRMS
# Ethiopian Pharmaceutical Supply Service (EPSS) - Operations & Infrastructure
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'epss-edrms-application'
    metrics_path: '/api/v1/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['epss-app:3000']
        labels:
          environment: 'production'
          organization: 'EPSS'
          service: 'edrms-core-api'

  - job_name: 'epss-nginx-reverse-proxy'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['nginx-proxy:80']
        labels:
          service: 'nginx-ingress'
